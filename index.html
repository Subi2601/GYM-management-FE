<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stag Fitness - Gym Management Software</title>
    <meta name="description" content="Members, renewals, payments, staff and QR attendance for your gym." />
    <meta name="theme-color" content="#c93434" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stag Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Apply the saved / OS theme before first paint (no white flash in dark mode).
      try {
        var t = localStorage.getItem("stag.theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
